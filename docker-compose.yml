services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: researchpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchpilot}
      POSTGRES_DB: researchpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://researchpilot:${POSTGRES_PASSWORD:-researchpilot}@db:5432/researchpilot
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fixture}
      SEARCH_FIXTURE_PATH: ${SEARCH_FIXTURE_PATH:-/app/evaluation/datasets/fixtures/demo_web.json}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - ./evaluation:/app/evaluation:ro
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  backend_data:
